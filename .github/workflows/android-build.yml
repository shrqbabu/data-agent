name: Android Build & Test

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-build.yml']
  pull_request:
    paths: ['android/**']
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        # The wrapper jar is generated in CI so the repo stays clean of binaries.
        run: gradle wrapper --gradle-version 8.11.1

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: analytics-agent-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
