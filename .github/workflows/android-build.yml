name: Android Build & Test

on:
  push:
    branches: [main, master]
    paths: ['android/**', '.github/workflows/android-build.yml']
  pull_request:
    paths: ['android/**']
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle wrapper & Set permissions
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x ./gradlew

      - name: Assemble Debug APK
        env:
          ANALYTICS_AGENT_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ANALYTICS_AGENT_SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANALYTICS_AGENT_API_URL: ${{ secrets.API_URL }}
        run: |
          ./gradlew :app:assembleDebug \
            -PANALYTICS_AGENT_SUPABASE_URL="${ANALYTICS_AGENT_SUPABASE_URL:-}" \
            -PANALYTICS_AGENT_SUPABASE_KEY="${ANALYTICS_AGENT_SUPABASE_KEY:-}" \
            -PANALYTICS_AGENT_API_URL="${ANALYTICS_AGENT_API_URL:-}" \
            --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: analytics-agent-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
